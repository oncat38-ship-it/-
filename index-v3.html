<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>ガチャ記録・分析</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#20242b;--muted:#707784;--line:#dfe3ea;--blue:#4169e1;--blue2:#eef2ff;--green:#e4f5e8;--yellow:#fff3cf;--red:#ffe4e4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.96);backdrop-filter:blur(12px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 12px}
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.main-tab{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800;font-size:15px}
.main-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
nav{max-width:760px;margin:auto}
main{max-width:760px;margin:auto;padding:12px 12px 60px}
.view-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}
.view-tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:700}
.view-tab.active{background:var(--blue2);border-color:#b9c6ff;color:#3153bd}
.notice{padding:12px;border-radius:14px;background:var(--yellow);font-size:13px;margin-bottom:10px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}
.label{font-size:11px;color:var(--muted)}
.value{font-size:20px;font-weight:850;margin-top:3px}
.title{font-weight:850;margin:3px 0 9px}
.small{font-size:12px;color:var(--muted)}
section{margin-top:11px}
form{display:grid;gap:9px}
.row{display:flex;gap:8px}
.row>*{flex:1}
label{font-size:12px;font-weight:750;display:block;margin-bottom:4px}
input,select,button{font:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:750}
.primary{background:var(--blue);color:#fff}.secondary{background:#eef0f5}.danger{background:var(--red);color:#a00}
.hidden{display:none!important}
.history-group{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.history-group summary{padding:11px 12px;font-weight:800;cursor:pointer;list-style:none}
.history-group summary::-webkit-details-marker{display:none}
.history-group summary:before{content:"＋";display:inline-block;width:20px;color:var(--blue)}
.history-group[open] summary:before{content:"－"}
.item{display:grid;grid-template-columns:43px 40px minmax(0,1fr) auto;gap:7px;align-items:center;padding:9px 10px;border-top:1px solid #eee;font-size:13px}
.rarity{font-weight:900;text-align:center}
.r5{color:#a16b00}.r4{color:#486bc5}.r3{color:#666}
.badge{font-size:10px;padding:4px 6px;border-radius:7px;background:#eee;white-space:nowrap}
.good{background:var(--green)}.warn{background:var(--yellow)}
.pill{display:inline-block;background:var(--blue2);color:#3153bd;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:750}
.detail{padding:12px;background:#fafbfe;border-top:1px solid #eee;font-size:13px;line-height:1.8}
.empty{padding:25px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:14px}
@media(max-width:430px){.item{grid-template-columns:35px 35px minmax(0,1fr) auto;font-size:12px}.row{gap:6px}}
</style>
</head>
<body>
<header>
<nav>
<h1>ガチャ記録・分析</h1>
<div class="main-tabs">
<button id="charTab" class="main-tab active" onclick="setType('char')">キャラガチャ</button>
<button id="weaponTab" class="main-tab" onclick="setType('weapon')">武器ガチャ</button>
</div>
</nav>
</header>

<main>
<div class="view-tabs">
<button class="view-tab active" id="tabDashboard" onclick="setView('dashboard')">概要</button>
<button class="view-tab" id="tabInput" onclick="setView('input')">登録</button>
<button class="view-tab" id="tabHistory" onclick="setView('history')">登録済み一覧</button>
<button class="view-tab" id="tabFives" onclick="setView('fives')">★5一覧</button>
</div>

<div id="dashboardView">
<div id="notice" class="notice"></div>
<div id="stats" class="grid"></div>
<section class="card">
<div class="title">現在の状態</div>
<div id="state"></div>
</section>
</div>

<div id="inputView" class="hidden">
<section class="card">
<div class="title" id="inputTitle">キャラガチャを登録</div>
<div class="small" style="margin-bottom:10px">現在選択中：<b id="inputTypeLabel">キャラガチャ</b></div>
<form id="form">
<div class="row">
<div><label>レア度</label><select id="rarity"><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
<div><label>日時</label><input id="date" type="datetime-local"></div>
</div>
<div><label>名前</label><input id="name" placeholder="4・5のみ入力すればOK"></div>

<div id="charFields">
<label>★5の結果</label>
<select id="charResult"><option value="">選択してください</option><option value="PU">PU</option><option value="恒常">恒常（すり抜け）</option></select>
</div>

<div id="weaponFields" class="hidden">
<div class="row">
<div><label>選択PU</label><select id="selected"><option value="PU-A">PU-A</option><option value="PU-B">PU-B</option></select></div>
<div><label>★5の結果</label><select id="weaponResult"><option value="">選択してください</option><option value="PU-A">PU-A</option><option value="PU-B">PU-B</option><option value="その他">その他</option></select></div>
</div>
</div>

<label>メモ</label><input id="memo" placeholder="任意">
<div class="row">
<button class="primary" type="submit">1件登録</button>
<button class="secondary" type="button" onclick="showBatch3()">★3をまとめて登録</button>
</div>
</form>

<div id="batch3" class="card hidden" style="margin-top:10px;background:#fafbfe">
<div class="title">★3をまとめて登録</div>
<div class="small" style="margin-bottom:9px">名前や★5結果は不要です。同じ日時で指定した件数の★3を一気に追加します。</div>
<div class="row">
<div><label>登録件数</label><input id="batch3Count" type="number" min="1" max="100" value="10"></div>
<div style="display:flex;align-items:end"><button class="primary" type="button" onclick="addBatch3()">まとめて登録</button></div>
</div>
<button class="secondary" type="button" onclick="hideBatch3()" style="margin-top:8px">閉じる</button>
</div>
</section>
</div>

<div id="historyView" class="hidden">
<section>
<div class="row" style="justify-content:space-between;align-items:center">
<div class="title">登録済み一覧</div>
<div class="small" id="historyCount"></div>
</div>
<div id="history"></div>
</section>
</div>

<div id="fivesView" class="hidden">
<section>
<div class="title">★5だけを見る</div>
<div class="small" style="margin-bottom:9px">★5が出た回だけを新しい順に表示します。</div>
<div id="fiveList"></div>
</section>
</div>

<section class="card" style="margin-top:14px">
<div class="title">データ管理</div>
<div class="row">
<button class="secondary" onclick="downloadJSON()">バックアップ</button>
<button class="secondary" onclick="importJSON()">復元</button>
</div>
<div class="small" style="margin-top:8px">記録はこのブラウザの端末内に保存されます。機種変更・ブラウザ削除に備えてバックアップをおすすめします。</div>
</section>
</main>

<script>
const KEY='gachaAnalyzerV2';
let data=JSON.parse(localStorage.getItem(KEY)||'{"char":[],"weapon":[],"settings":{"selected":"PU-A"}}');
if(!data.char)data.char=[]; if(!data.weapon)data.weapon=[]; if(!data.settings)data.settings={selected:"PU-A"};
let type='char', view='dashboard';

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function a(){return data[type]}
function setType(t){type=t;view='dashboard';update()}
function setView(v){view=v;update()}
function setActiveTabs(){
 document.getElementById('charTab').classList.toggle('active',type==='char');
 document.getElementById('weaponTab').classList.toggle('active',type==='weapon');
 ['dashboard','input','history','fives'].forEach(v=>document.getElementById('tab'+v[0].toUpperCase()+v.slice(1)).classList.toggle('active',view===v));
}
function last5(){return [...a()].reverse().find(x=>x.rarity===5)}
function pity(){
 const ar=a(); for(let i=ar.length-1;i>=0;i--)if(ar[i].rarity===5)return ar.length-i-1;
 return ar.length;
}
function missCount(){
 let n=0;
 for(let i=a().length-1;i>=0;i--){
  const x=a()[i]; if(x.rarity!==5)continue;
  if(x.classification==='miss')n++;
  else if(x.classification==='5050')break;
  else if(x.classification==='guaranteed')continue;
 }
 return n;
}
function classify(item, ar){
 if(item.rarity!==5)return '';
 if(type==='char'){
  const n=missCount();
  if(item.result==='恒常')return 'miss';
  if(item.result==='PU')return n>0?'guaranteed':'5050';
 }else{
  if(item.result==='その他')return 'miss';
  if(item.result===item.selected){
   const prev=[...ar].reverse().find(x=>x.rarity===5);
   return prev&&prev.classification==='miss'?'guaranteed':'5050';
  }
  return 'miss';
 }
 return '';
}
function intervalMax(fives){
 if(fives.length<2)return fives.length?fives[0].no:'—';
 return Math.max(...fives.map((x,i)=>i?x.no-fives[i-1].no:0))+'回';
}
function update(){
 setActiveTabs();
 document.getElementById('dashboardView').classList.toggle('hidden',view!=='dashboard');
 document.getElementById('inputView').classList.toggle('hidden',view!=='input');
 document.getElementById('historyView').classList.toggle('hidden',view!=='history');
 document.getElementById('fivesView').classList.toggle('hidden',view!=='fives');
 renderDashboard();renderInput();renderHistory();renderFives();
}
function renderDashboard(){
 const ar=a(), f=ar.filter(x=>x.rarity===5), four=ar.filter(x=>x.rarity>=4);
 const p=pity(), soft=type==='char'?76:66, max=type==='char'?90:80, misses=missCount();
 let notice=type==='char'
  ?`★5天井 <b>${p}/${max}</b>　${p>=soft?'<b>現在は仮天井区間</b>　':''}すり抜け累積 <b>${misses}/3</b>`
  :`★5天井 <b>${p}/${max}</b>　${p>=soft?'<b>現在は仮天井区間</b>　':''}選択PU <b>${data.settings.selected||'未設定'}</b>`;
 document.getElementById('notice').innerHTML=notice;
 const avg=f.length>1?(f.reduce((s,x,i)=>s+(i?x.no-f[i-1].no:0),0)/(f.length-1)).toFixed(1)+'回':'—';
 document.getElementById('stats').innerHTML=[
 ['総回数',ar.length+'回'],['★5',f.length+'回'],['★5率',ar.length?(f.length/ar.length*100).toFixed(2)+'%':'0%'],['★4以上率',ar.length?(four.length/ar.length*100).toFixed(2)+'%':'0%'],['★5平均間隔',avg],['★5最大間隔',intervalMax(f)]
 ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');
 let state='';
 if(type==='char')state=`すり抜け累積：<b>${misses}/3</b><br>${misses>=3?'次の★5はPU確定です。':'★5ですり抜けた場合、次回はPU確定です。'}<br><span class="small">※3回のすり抜け累積は、通常の50/50でPUを引いた場合にリセットされます。</span>`;
 else state=`選択PU：<b>${data.settings.selected||'未設定'}</b><br>選択PUを外した場合、次回は選択PU確定です。`;
 document.getElementById('state').innerHTML=state;
}
function renderInput(){
 const char=type==='char', r=+document.getElementById('rarity').value;
 document.getElementById('inputTitle').textContent=(char?'キャラ':'武器')+'ガチャを登録';
 document.getElementById('inputTypeLabel').textContent=char?'キャラガチャ':'武器ガチャ';
 document.getElementById('charFields').classList.toggle('hidden',!char||r!==5);
 document.getElementById('weaponFields').classList.toggle('hidden',char||r!==5);
 if(!char)document.getElementById('selected').value=data.settings.selected||'PU-A';
}
function renderHistory(){
 const ar=a(), box=document.getElementById('history');document.getElementById('historyCount').textContent=ar.length+'件';
 if(!ar.length){box.innerHTML='<div class="empty">まだ登録されていません。<br>「登録」からガチャ結果を追加してください。</div>';return}
 box.innerHTML='';
 for(let end=ar.length;end>0;){
  const start=Math.max(0,end-10), chunk=ar.slice(start,end);
  const d=document.createElement('details');d.className='history-group';if(end===ar.length)d.open=true;
  d.innerHTML=`<summary>${start+1}～${end}回　（${chunk.length}件）</summary>`;
  const h=document.createElement('div');
  chunk.slice().reverse().forEach(x=>{
   let badge='';
   if(x.rarity===5)badge=type==='char'?(x.classification==='miss'?'すり抜け':x.classification==='guaranteed'?'確定PU':'50/50 PU'):(x.classification==='miss'?'選択PU外':x.classification==='guaranteed'?'選択PU確定':'選択PU');
   h.innerHTML+=`<div class="item"><b>#${x.no}</b><span class="rarity r${x.rarity}">★${x.rarity}</span><span>${esc(x.name||'名前なし')}</span><span class="badge ${x.rarity===5?'good':''}">${badge}</span></div><div class="detail"><b>日時：</b>${esc(x.date||'未入力')}　${x.memo?'<br><b>メモ：</b>'+esc(x.memo):''}</div>`;
  });
  d.appendChild(h);box.appendChild(d);end=start;
 }
}
function renderFives(){
 const ar=a().filter(x=>x.rarity===5).slice().reverse(),box=document.getElementById('fiveList');
 if(!ar.length){box.innerHTML='<div class="empty">まだ★5の記録がありません。</div>';return}
 box.innerHTML=ar.map(x=>{
  const badge=type==='char'?(x.classification==='miss'?'すり抜け':x.classification==='guaranteed'?'確定PU':'50/50 PU'):(x.classification==='miss'?'選択PU外':x.classification==='guaranteed'?'選択PU確定':'選択PU');
  const idx=a().findIndex(y=>y.no===x.no), prev=idx>0?a()[idx-1]:null;
  return `<div class="card" style="margin-bottom:8px"><div class="row"><b>#${x.no}　★5</b><span class="badge good">${badge}</span></div><div>${esc(x.name||'名前なし')}</div><div class="small">前回★5から：${prev&&prev.rarity===5?x.no-prev.no+'回':'初回／記録前'}</div></div>`;
 }).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('rarity').addEventListener('change',renderInput);
document.getElementById('selected').addEventListener('change',e=>{data.settings.selected=e.target.value;save();update()});
document.getElementById('form').addEventListener('submit',e=>{
 e.preventDefault();
 const ar=a(),r=+document.getElementById('rarity').value;
 const item={no:ar.length+1,rarity:r,date:document.getElementById('date').value,name:document.getElementById('name').value,memo:document.getElementById('memo').value,selected:data.settings.selected||'PU-A'};
 item.result=type==='char'?document.getElementById('charResult').value:document.getElementById('weaponResult').value;
 if(r===5 && !item.result){alert('★5の結果を選択してください。');return}
 item.classification=classify(item,ar);ar.push(item);save();
 document.getElementById('name').value='';document.getElementById('memo').value='';
 document.getElementById('charResult').value='';document.getElementById('weaponResult').value='';
 // 連続登録しやすいよう、登録画面に留まる
 update();
 document.getElementById('rarity').value=3;
 renderInput();
});
function showBatch3(){
 document.getElementById('batch3').classList.remove('hidden');
 document.getElementById('batch3Count').focus();
}
function hideBatch3(){
 document.getElementById('batch3').classList.add('hidden');
}
function addBatch3(){
 const count=Math.max(1,Math.min(100,parseInt(document.getElementById('batch3Count').value||'1',10)));
 const ar=a();
 const date=document.getElementById('date').value;
 for(let i=0;i<count;i++){
  ar.push({
   no:ar.length+1,
   rarity:3,
   date:date,
   name:'',
   memo:'',
   selected:data.settings.selected||'PU-A',
   result:'',
   classification:''
  });
 }
 save();
 hideBatch3();
 update();
 setView('input');
 alert(count+'件の★3をまとめて登録しました。');
}
function downloadJSON(){
 const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='gacha-backup.json';a.click();URL.revokeObjectURL(u)
}
function importJSON(){
 const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();update();alert('復元しました。')}catch(e){alert('読み込みに失敗しました。')}};r.readAsText(i.files[0])};i.click()
}
document.getElementById('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
update();
</script>
</body>
</html>
